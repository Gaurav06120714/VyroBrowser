name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  # ── macOS build ─────────────────────────────────────────────────────────────
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/browser/package-lock.json

      - name: Install dependencies
        working-directory: apps/browser
        run: npm ci

      - name: Build & Package (macOS)
        working-directory: apps/browser
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run package:mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-dist
          path: |
            apps/browser/dist/*.dmg
            apps/browser/dist/*.zip

  # ── Windows build ────────────────────────────────────────────────────────────
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/browser/package-lock.json

      - name: Install dependencies
        working-directory: apps/browser
        run: npm ci

      - name: Build & Package (Windows)
        working-directory: apps/browser
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run package:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-dist
          path: |
            apps/browser/dist/*.exe

  # ── Linux build ──────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/browser/package-lock.json

      - name: Install Linux build deps
        run: sudo apt-get install -y rpm fakeroot

      - name: Install dependencies
        working-directory: apps/browser
        run: npm ci

      - name: Build & Package (Linux)
        working-directory: apps/browser
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run package:linux

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: |
            apps/browser/dist/*.AppImage
            apps/browser/dist/*.deb

  # ── Publish GitHub Release ───────────────────────────────────────────────────
  publish:
    needs: [build-mac, build-win, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-all

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Vyro Browser ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist-all/**/*.dmg
            dist-all/**/*.zip
            dist-all/**/*.exe
            dist-all/**/*.AppImage
            dist-all/**/*.deb
          body: |
            ## Vyro Browser ${{ github.ref_name }}

            **AI-first desktop browser — Local · Private · Fast**

            ### Download

            | Platform | File | Notes |
            |---|---|---|
            | macOS (Apple Silicon) | `Vyro-*-arm64.dmg` | Drag to Applications |
            | macOS (Intel) | `Vyro-*-x64.dmg` | Drag to Applications |
            | Windows | `Vyro-*-Setup.exe` | Run installer |
            | Windows (portable) | `Vyro-*-portable.exe` | No install needed |
            | Linux | `Vyro-*.AppImage` | `chmod +x` then run |
            | Linux (Debian/Ubuntu) | `Vyro-*.deb` | `sudo dpkg -i` |

            ### What's new
            See [CHANGELOG](https://github.com/Gaurav06120714/VyroBrowser/blob/main/CHANGELOG.md) for details.

            ### Share
            Share these download links directly via WhatsApp, Telegram, or Google Drive.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
